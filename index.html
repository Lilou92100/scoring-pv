<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoring Prospect PV v3.0</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B0F1A; color: #F1F5F9; font-family: 'Segoe UI', 'SF Pro Display', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    select, input, button { font-family: inherit; }
    select option { background: #111827; color: #F1F5F9; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { opacity: 1; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F1A; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    const C = {
      bg:"#0B0F1A",card:"#111827",border:"#1E293B",
      accent:"#F59E0B",accentDim:"rgba(245,158,11,0.12)",
      green:"#10B981",red:"#EF4444",blue:"#3B82F6",
      purple:"#8B5CF6",cyan:"#06B6D4",
      orange:"#F97316",orangeDim:"rgba(249,115,22,0.12)",
      text:"#F1F5F9",muted:"#94A3B8",dim:"#64748B",
    };

    const CATS = {
      A:{label:"Prospect Chaud",color:C.green,icon:"🔥",action:"Contact prioritaire · Offre personnalisée · Visite terrain sous 48h"},
      B:{label:"Prospect Tiède",color:C.accent,icon:"☀️",action:"Campagne ciblée · Simulation gratuite · Nurturing email/SMS"},
      C:{label:"Prospect Froid",color:C.blue,icon:"❄️",action:"Sensibilisation · Contenu éducatif · Veille opportunité"},
      D:{label:"Hors Cible",color:C.red,icon:"⛔",action:"Pas d'action commerciale directe"},
    };
    const getCat=s=>s>=75?"A":s>=55?"B":s>=35?"C":"D";

    // ═══════════ SCORING ═══════════

    function scoreDPE(d){
      let pts=0,max=0,details=[];
      // Étiquette
      const dpeMap={D:10,E:9,C:8,F:7,B:5,G:4,A:2};
      if(d.etiquetteDpe){const v=dpeMap[d.etiquetteDpe]||0;pts+=v;max+=10;details.push({l:`Étiquette ${d.etiquetteDpe}`,p:v,m:10});}
      // Énergies
      const eMap={"Fioul domestique":6,GPL:5,"Électricité":5,"Gaz naturel":4,Bois:2,PAC:2};
      if(d.energieChauffage){const v=eMap[d.energieChauffage]||0;pts+=v;max+=6;details.push({l:`Chauffage: ${d.energieChauffage}`,p:v,m:6});}
      const ecsMap={"Électricité (ballon)":4,"Électricité (thermodynamique)":3,"Fioul domestique":3,GPL:3,"Gaz naturel":2,"Solaire thermique":1,Bois:1,"Réseau de chaleur":0};
      if(d.energieECS){const v=ecsMap[d.energieECS]??0;pts+=v;max+=4;details.push({l:`ECS: ${d.energieECS}`,p:v,m:4});}
      // Coûts ventilés
      if(d.coutChauffage!==""){const c=+d.coutChauffage;const v=c>2500?5:c>1500?4:c>800?3:c>300?2:1;pts+=v;max+=5;details.push({l:`Coût chauff. ${c.toLocaleString("fr-FR")} €/an`,p:v,m:5});}
      if(d.coutECS!==""){const c=+d.coutECS;const v=c>500?3:c>250?2:1;pts+=v;max+=3;details.push({l:`Coût ECS ${c.toLocaleString("fr-FR")} €/an`,p:v,m:3});}
      // Consos ventilées
      if(d.consoElec!==""){const c=+d.consoElec;const v=c>5000?3:c>2000?2:1;pts+=v;max+=3;details.push({l:`Conso élec. ${(c/1000).toFixed(1)}k kWh`,p:v,m:3});}
      if(d.consoChauffFossile!==""){const c=+d.consoChauffFossile;const v=c>15000?3:c>8000?2:1;pts+=v;max+=3;details.push({l:`Conso chauff. fossile ${(c/1000).toFixed(1)}k kWh`,p:v,m:3});}
      // Localisation
      const zMap={H3:5,H2d:5,H2c:5,H2b:4,H2a:3,H1c:2,H1b:2,H1a:2};
      if(d.zoneClimatique){const v=zMap[d.zoneClimatique]||2;pts+=v;max+=5;details.push({l:`Zone ${d.zoneClimatique}`,p:v,m:5});}
      const aMap={"< 400m":2,"400-800m":1,"> 800m":0};
      if(d.altitude){const v=aMap[d.altitude]??1;pts+=v;max+=2;details.push({l:`Altitude ${d.altitude}`,p:v,m:2});}
      // Bâtiment
      if(d.surface!==""){const s=+d.surface;const v=s>120?5:s>80?4:s>50?3:1;pts+=v;max+=5;details.push({l:`Surface ${s} m²`,p:v,m:5});}
      const nMap={"1":4,"2":3,"3+":2};
      if(d.niveaux){const v=nMap[d.niveaux]||2;pts+=v;max+=4;details.push({l:`${d.niveaux} niveau(x)`,p:v,m:4});}
      const pMap={"Après 1990":4,"1975-1990":3,"1948-1974":2,"Avant 1948":1};
      if(d.periodeConstruction){const v=pMap[d.periodeConstruction]||2;pts+=v;max+=4;details.push({l:d.periodeConstruction,p:v,m:4});}
      if(d.pvExistant!==""){const v=d.pvExistant==="Non"?2:-20;pts+=v;max+=2;details.push({l:`PV existant: ${d.pvExistant}`,p:v,m:2});}
      return{pts,max:max||56,details,section:"DPE & Logement",color:C.accent};
    }

    function scoreToiture(d){
      let pts=0,max=0,details=[];
      const oMap={Sud:8,"Sud-Est":7,"Sud-Ouest":7,Est:4,Ouest:4,"Nord-Est":1,"Nord-Ouest":1,Nord:0};
      if(d.orientationToiture){const v=oMap[d.orientationToiture]??4;pts+=v;max+=8;details.push({l:`Orientation ${d.orientationToiture}`,p:v,m:8});}
      const iMap={"15-35°":5,"0-15° (plat)":3,"35-45°":3,"> 45°":1};
      if(d.inclinaisonToiture){const v=iMap[d.inclinaisonToiture]||3;pts+=v;max+=5;details.push({l:`Inclinaison ${d.inclinaisonToiture}`,p:v,m:5});}
      if(d.surfaceToiture!==""){const s=+d.surfaceToiture;const v=s>60?4:s>40?3:s>20?2:1;pts+=v;max+=4;details.push({l:`Surface toiture ${s} m²`,p:v,m:4});}
      return{pts,max:max||17,details,section:"Toiture",color:C.cyan};
    }

    // ═══════════ SCORING FACILITÉ ═══════════

    function scoreFacilite(d){
      let sections=[];

      // Type de chauffage → facilité
      let pts1=0,max1=0,det1=[];
      const chMap={"PAC":10,"Électricité":9,"Gaz naturel":6,"Bois":4,GPL:3,"Fioul domestique":2};
      if(d.energieChauffage){const v=chMap[d.energieChauffage]||4;pts1+=v;max1+=10;det1.push({l:`Chauffage: ${d.energieChauffage}`,p:v,m:10});}
      sections.push({pts:pts1,max:max1||10,details:det1,section:"Système chauffage",color:"#22D3EE"});

      // Type ECS → facilité
      let pts2=0,max2=0,det2=[];
      const ecsMap={"Électricité (ballon)":10,"Électricité (thermodynamique)":10,"Solaire thermique":8,"Gaz naturel":5,GPL:3,"Fioul domestique":2,Bois:2,"Réseau de chaleur":7};
      if(d.energieECS){const v=ecsMap[d.energieECS]||5;pts2+=v;max2+=10;det2.push({l:`ECS: ${d.energieECS}`,p:v,m:10});}
      sections.push({pts:pts2,max:max2||10,details:det2,section:"Système ECS",color:"#34D399"});

      // Qualité isolation
      let pts3=0,max3=0,det3=[];
      const isoMap={"Bonne":10,"Moyenne":7,"Insuffisante":3,"Très insuffisante":1};
      if(d.qualiteIsolation){const v=isoMap[d.qualiteIsolation]||5;pts3+=v;max3+=10;det3.push({l:`Isolation: ${d.qualiteIsolation}`,p:v,m:10});}
      sections.push({pts:pts3,max:max3||10,details:det3,section:"Isolation enveloppe",color:"#A78BFA"});

      const rawPts=sections.reduce((s,sec)=>s+sec.pts,0);
      const maxR=sections.reduce((s,sec)=>s+sec.max,0);
      const score=maxR>0?Math.max(0,Math.min(100,Math.round((rawPts/maxR)*100))):0;
      return{score,sections};
    }

    function computeROI(d){
      const coutTotal=(d.coutChauffage!==""?+d.coutChauffage:0)+(d.coutECS!==""?+d.coutECS:0);
      if(!d.zoneClimatique||d.surfaceToiture===""||coutTotal===0) return null;
      const prodMap={H3:1350,H2d:1250,H2c:1200,H2b:1100,H2a:1050,H1c:1000,H1b:950,H1a:900};
      const kWhParKwc=prodMap[d.zoneClimatique]||1050;
      const surfUtil=+d.surfaceToiture;
      const oCoeff={Sud:1,"Sud-Est":0.94,"Sud-Ouest":0.94,Est:0.82,Ouest:0.82,"Nord-Est":0.6,"Nord-Ouest":0.6,Nord:0.45}[d.orientationToiture]||0.9;
      const iCoeff={"15-35°":1,"0-15° (plat)":0.9,"35-45°":0.92,"> 45°":0.78}[d.inclinaisonToiture]||0.92;
      const kwcMax=Math.min(9,Math.floor(surfUtil/6));
      if(kwcMax<1) return null;
      const prodAnnuelle=kwcMax*kWhParKwc*oCoeff*iCoeff;
      const consoElecTot=d.consoElec!==""?+d.consoElec:0;
      const tauxAutoconso=consoElecTot>0?Math.min(0.7,(consoElecTot*0.7)/prodAnnuelle):0.45;
      const prixKwh=0.2516,prixRevente=0.1269;
      const econAutoconso=prodAnnuelle*tauxAutoconso*prixKwh;
      const reventeExcedent=prodAnnuelle*(1-tauxAutoconso)*prixRevente;
      const gainAnnuel=econAutoconso+reventeExcedent;
      const coutInstall=kwcMax*2400;
      const primeAutoconso=kwcMax<=3?kwcMax*370:kwcMax<=9?kwcMax*280:kwcMax*200;
      const investNet=coutInstall-primeAutoconso;
      const retour=gainAnnuel>0?investNet/gainAnnuel:99;
      return{kwc:kwcMax,prodAnnuelle:Math.round(prodAnnuelle),gainAnnuel:Math.round(gainAnnuel),investNet:Math.round(investNet),retour:Math.round(retour*10)/10,tauxAutoconso:Math.round(tauxAutoconso*100),econAutoconso:Math.round(econAutoconso),reventeExcedent:Math.round(reventeExcedent),primeAutoconso:Math.round(primeAutoconso),coutTotal:Math.round(coutTotal)};
    }

    function computeTotal(d){
      const sections=[scoreDPE(d),scoreToiture(d)];
      const rawPts=sections.reduce((s,sec)=>s+sec.pts,0);
      const maxR=sections.reduce((s,sec)=>s+sec.max,0);
      const norm=maxR>0?Math.round((rawPts/maxR)*100):0;
      const score=Math.max(0,Math.min(100,norm));
      const allFields=[d.etiquetteDpe,d.energieChauffage,d.energieECS,d.coutChauffage,d.coutECS,d.consoElec,d.consoChauffFossile,d.zoneClimatique,d.altitude,d.orientationToiture,d.inclinaisonToiture,d.surfaceToiture,d.surface,d.niveaux,d.periodeConstruction,d.pvExistant,d.qualiteIsolation];
      const filled=allFields.filter(v=>v!==""&&v!==null&&v!==undefined).length;
      const completude=Math.round((filled/allFields.length)*100);
      const facilite=scoreFacilite(d);
      const global=score>0&&facilite.score>0?Math.round(score*0.6+facilite.score*0.4):score>0?score:facilite.score>0?facilite.score:0;
      return{score,sections,completude,roi:computeROI(d),facilite,global};
    }

    // ═══════════ UI ═══════════

    const labelSt={display:"block",fontSize:11,fontWeight:700,color:C.muted,marginBottom:3,letterSpacing:"0.04em",textTransform:"uppercase"};
    const inputSt={width:"100%",padding:"9px 11px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:7,color:C.text,fontSize:13,outline:"none",boxSizing:"border-box"};

    function Sel({label,value,onChange,options,hint}){
      return React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:labelSt},label),
        React.createElement("select",{value,onChange:e=>onChange(e.target.value),style:{...inputSt,color:value?C.text:C.dim,cursor:"pointer"}},
          React.createElement("option",{value:""},hint||"— Sélectionner —"),
          options.map(o=>React.createElement("option",{key:o,value:o},o))
        )
      );
    }

    function Num({label,value,onChange,unit,placeholder}){
      return React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:labelSt},label),
        React.createElement("div",{style:{position:"relative"}},
          React.createElement("input",{type:"number",value,onChange:e=>onChange(e.target.value),placeholder:placeholder||"—",style:{...inputSt,paddingRight:unit?48:11}}),
          unit&&React.createElement("span",{style:{position:"absolute",right:11,top:"50%",transform:"translateY(-50%)",color:C.dim,fontSize:12}},unit)
        )
      );
    }

    function Tog({label,checked,onChange}){
      return React.createElement("div",{onClick:()=>onChange(!checked),style:{display:"flex",alignItems:"center",gap:9,cursor:"pointer",padding:"6px 0",fontSize:13,color:checked?C.text:C.muted,userSelect:"none"}},
        React.createElement("div",{style:{width:36,height:20,borderRadius:10,position:"relative",background:checked?C.accent:C.border,transition:"background 0.2s",flexShrink:0}},
          React.createElement("div",{style:{width:16,height:16,borderRadius:"50%",background:"#fff",position:"absolute",top:2,left:checked?18:2,transition:"left 0.2s",boxShadow:"0 1px 2px rgba(0,0,0,0.3)"}})
        ),
        React.createElement("span",null,label)
      );
    }

    function Row({children}){return React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},children);}

    function ScoreGauge({score}){
      const cat=getCat(score),info=CATS[cat],sz=190,circ=Math.PI*(sz-20),off=circ-(score/100)*circ;
      return React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center"}},
        React.createElement("svg",{width:sz,height:sz/2+30,viewBox:`0 0 ${sz} ${sz/2+30}`},
          React.createElement("path",{d:`M 10 ${sz/2+10} A ${sz/2-10} ${sz/2-10} 0 0 1 ${sz-10} ${sz/2+10}`,fill:"none",stroke:C.border,strokeWidth:10,strokeLinecap:"round"}),
          React.createElement("path",{d:`M 10 ${sz/2+10} A ${sz/2-10} ${sz/2-10} 0 0 1 ${sz-10} ${sz/2+10}`,fill:"none",stroke:info.color,strokeWidth:10,strokeLinecap:"round",strokeDasharray:circ,strokeDashoffset:off,style:{transition:"stroke-dashoffset 0.7s ease-out, stroke 0.3s"}}),
          React.createElement("text",{x:sz/2,y:sz/2-5,textAnchor:"middle",fill:info.color,style:{fontSize:44,fontWeight:800,fontFamily:"'JetBrains Mono', monospace"}},score),
          React.createElement("text",{x:sz/2,y:sz/2+18,textAnchor:"middle",fill:C.dim,style:{fontSize:13}},"/ 100")
        ),
        React.createElement("div",{style:{marginTop:4,padding:"5px 18px",borderRadius:20,background:`${info.color}18`,border:`1px solid ${info.color}44`,color:info.color,fontWeight:700,fontSize:14}},`${info.icon} ${cat} — ${info.label}`)
      );
    }

    function Bars({sections}){
      return React.createElement("div",{style:{marginTop:14}},
        sections.map(sec=>{
          const pct=sec.max>0?Math.max(0,(sec.pts/sec.max)*100):0;
          return React.createElement("div",{key:sec.section,style:{marginBottom:10}},
            React.createElement("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3,color:C.muted}},
              React.createElement("span",{style:{fontWeight:600}},sec.section),
              React.createElement("span",{style:{fontFamily:"'JetBrains Mono', monospace",color:sec.color}},`${sec.pts}/${sec.max}`)
            ),
            React.createElement("div",{style:{height:5,background:C.border,borderRadius:3,overflow:"hidden"}},
              React.createElement("div",{style:{height:"100%",width:`${pct}%`,background:sec.color,borderRadius:3,transition:"width 0.5s ease-out"}})
            )
          );
        })
      );
    }

    function Details({sections}){
      const[open,setOpen]=useState(null);
      return React.createElement("div",{style:{marginTop:10}},
        React.createElement("div",{style:{fontSize:11,fontWeight:700,color:C.dim,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Détail scoring"),
        sections.map((sec,i)=>React.createElement("div",{key:sec.section,style:{marginBottom:3}},
          React.createElement("div",{onClick:()=>setOpen(open===i?null:i),style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:open===i?`${sec.color}11`:"transparent",border:`1px solid ${open===i?sec.color+"44":C.border}`,borderRadius:7,cursor:"pointer",transition:"all 0.2s"}},
            React.createElement("span",{style:{fontSize:12,fontWeight:600,color:C.text}},sec.section),
            React.createElement("span",{style:{fontSize:11,color:sec.color,fontFamily:"'JetBrains Mono', monospace"}},`${sec.pts} pts ${open===i?"▴":"▾"}`)
          ),
          open===i&&React.createElement("div",{style:{padding:"6px 10px 4px 22px"}},
            sec.details.length===0
              ?React.createElement("div",{style:{fontSize:11,color:C.dim,fontStyle:"italic"}},"Aucune donnée renseignée")
              :sec.details.map((dd,j)=>React.createElement("div",{key:j,style:{display:"flex",justifyContent:"space-between",fontSize:11,padding:"2px 0",color:C.muted}},
                React.createElement("span",null,dd.l),
                React.createElement("span",{style:{fontFamily:"'JetBrains Mono', monospace",fontWeight:600,color:dd.p>0?sec.color:dd.p<0?C.red:C.dim}},`${dd.p>0?"+":""}${dd.p}`)
              ))
          )
        ))
      );
    }

    function ROICard({roi}){
      if(!roi) return React.createElement("div",{style:{marginTop:14,padding:14,background:C.orangeDim,border:`1px solid ${C.orange}33`,borderRadius:10}},
        React.createElement("div",{style:{fontSize:12,fontWeight:700,color:C.orange,marginBottom:4}},"📊 Estimateur ROI"),
        React.createElement("div",{style:{fontSize:11,color:C.muted,lineHeight:1.5}},"Renseignez la zone climatique, la surface toiture et le coût chauffage pour activer l'estimation.")
      );
      const retourColor=roi.retour<=8?C.green:roi.retour<=12?C.accent:C.red;
      const roiLines=[["Puissance installable",`${roi.kwc} kWc`],["Production annuelle",`${roi.prodAnnuelle.toLocaleString("fr-FR")} kWh`],["Taux d'autoconsommation",`${roi.tauxAutoconso}%`],["Économie autoconso.",`${roi.econAutoconso.toLocaleString("fr-FR")} €/an`],["Revente excédent (OA)",`${roi.reventeExcedent.toLocaleString("fr-FR")} €/an`],["Prime autoconsommation",`${roi.primeAutoconso.toLocaleString("fr-FR")} €`],["Investissement net",`${roi.investNet.toLocaleString("fr-FR")} €`]];
      return React.createElement("div",{style:{marginTop:14,padding:14,background:`${C.green}08`,border:`1px solid ${C.green}33`,borderRadius:10}},
        React.createElement("div",{style:{fontSize:12,fontWeight:700,color:C.green,marginBottom:10}},"📊 Estimation ROI Photovoltaïque"),
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}},
          React.createElement("div",{style:{background:C.bg,borderRadius:8,padding:10,textAlign:"center"}},
            React.createElement("div",{style:{fontSize:22,fontWeight:800,color:retourColor,fontFamily:"'JetBrains Mono', monospace"}},roi.retour,React.createElement("span",{style:{fontSize:12}}," ans")),
            React.createElement("div",{style:{fontSize:10,color:C.dim,marginTop:2}},"Temps de retour")
          ),
          React.createElement("div",{style:{background:C.bg,borderRadius:8,padding:10,textAlign:"center"}},
            React.createElement("div",{style:{fontSize:22,fontWeight:800,color:C.accent,fontFamily:"'JetBrains Mono', monospace"}},roi.gainAnnuel,React.createElement("span",{style:{fontSize:12}}," €")),
            React.createElement("div",{style:{fontSize:10,color:C.dim,marginTop:2}},"Gain annuel")
          )
        ),
        React.createElement("div",{style:{fontSize:11,color:C.muted,lineHeight:1.9}},
          roiLines.map(([k,v])=>React.createElement("div",{key:k,style:{display:"flex",justifyContent:"space-between"}},
            React.createElement("span",null,k),
            React.createElement("span",{style:{fontFamily:"'JetBrains Mono', monospace",fontWeight:600,color:C.text}},v)
          ))
        ),
        React.createElement("div",{style:{marginTop:8,fontSize:10,color:C.dim,lineHeight:1.4,fontStyle:"italic"}},"* Estimation indicative · Tarif réglementé 2025 (0,2516 €/kWh) · OA S1 2025")
      );
    }

    // ═══════════ MAIN ═══════════

    const INIT={etiquetteDpe:"",energieChauffage:"",energieECS:"",coutChauffage:"",coutECS:"",consoElec:"",consoChauffFossile:"",zoneClimatique:"",altitude:"",orientationToiture:"",inclinaisonToiture:"",surfaceToiture:"",surface:"",niveaux:"",periodeConstruction:"",pvExistant:"",qualiteIsolation:""};

    const EXAMPLE={...INIT,etiquetteDpe:"F",energieChauffage:"Fioul domestique",energieECS:"Fioul domestique",coutChauffage:"2316",coutECS:"432",consoElec:"364",consoChauffFossile:"15629",zoneClimatique:"H2b",altitude:"< 400m",orientationToiture:"Sud-Ouest",inclinaisonToiture:"15-35°",surfaceToiture:"55",surface:"81",niveaux:"1",periodeConstruction:"1948-1974",pvExistant:"Non",qualiteIsolation:"Insuffisante"};

    function App(){
      const[data,setData]=useState(INIT);
      const[tab,setTab]=useState(0);
      const[mobileView,setMobileView]=useState("form");
      const s=k=>v=>setData(d=>({...d,[k]:v}));
      const result=computeTotal(data);
      const catInfo=CATS[getCat(result.score)];

      const tabs=[
        {label:"DPE",icon:"⚡",color:C.accent},
        {label:"Toiture",icon:"🏗️",color:C.cyan},
      ];

      const isMobile=typeof window!=="undefined"&&window.innerWidth<=768;

      function MiniGauge({score,label,color,size}){
        const sz=size||100,circ=Math.PI*(sz-12),off=circ-(score/100)*circ;
        return React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center"}},
          React.createElement("svg",{width:sz,height:sz/2+18,viewBox:`0 0 ${sz} ${sz/2+18}`},
            React.createElement("path",{d:`M 6 ${sz/2+6} A ${sz/2-6} ${sz/2-6} 0 0 1 ${sz-6} ${sz/2+6}`,fill:"none",stroke:C.border,strokeWidth:6,strokeLinecap:"round"}),
            React.createElement("path",{d:`M 6 ${sz/2+6} A ${sz/2-6} ${sz/2-6} 0 0 1 ${sz-6} ${sz/2+6}`,fill:"none",stroke:color,strokeWidth:6,strokeLinecap:"round",strokeDasharray:circ,strokeDashoffset:off,style:{transition:"stroke-dashoffset 0.7s ease-out"}}),
            React.createElement("text",{x:sz/2,y:sz/2-2,textAnchor:"middle",fill:color,style:{fontSize:22,fontWeight:800,fontFamily:"'JetBrains Mono', monospace"}},score),
            React.createElement("text",{x:sz/2,y:sz/2+10,textAnchor:"middle",fill:C.dim,style:{fontSize:9}},"/100")
          ),
          React.createElement("div",{style:{fontSize:10,fontWeight:600,color:color,marginTop:2,textAlign:"center"}},label)
        );
      }

      function ResultsPanel(){
        const fScore=result.facilite.score;
        const gScore=result.global;
        const gCat=getCat(gScore);
        const gInfo=CATS[gCat];
        const fColor=fScore>=70?C.green:fScore>=40?C.accent:fScore>0?C.red:C.dim;

        return React.createElement("div",{style:{background:C.card,borderRadius:11,border:`1px solid ${C.border}`,padding:16}},
          // Triple gauges
          React.createElement("div",{style:{display:"flex",justifyContent:"center",gap:8,marginBottom:8}},
            React.createElement(MiniGauge,{score:result.score,label:"Prospect",color:catInfo.color,size:95}),
            React.createElement(MiniGauge,{score:fScore,label:"Facilité",color:fColor,size:95}),
            React.createElement(MiniGauge,{score:gScore,label:"Global",color:gInfo.color,size:95})
          ),
          // Global category
          React.createElement("div",{style:{textAlign:"center",marginBottom:10}},
            React.createElement("div",{style:{display:"inline-block",padding:"4px 14px",borderRadius:16,background:`${gInfo.color}18`,border:`1px solid ${gInfo.color}44`,color:gInfo.color,fontWeight:700,fontSize:12}},`${gInfo.icon} ${gCat} — ${gInfo.label}`),
            React.createElement("div",{style:{fontSize:9,color:C.dim,marginTop:4}},"Global = 60% Prospect + 40% Facilité")
          ),
          // Complétude
          React.createElement("div",{style:{marginTop:8,textAlign:"center"}},
            React.createElement("div",{style:{fontSize:10,color:C.dim,marginBottom:3}},`Complétude: ${result.completude}%`),
            React.createElement("div",{style:{height:4,background:C.border,borderRadius:2,overflow:"hidden",maxWidth:150,margin:"0 auto"}},
              React.createElement("div",{style:{height:"100%",width:`${result.completude}%`,background:result.completude>70?C.green:result.completude>40?C.accent:C.red,borderRadius:2,transition:"width 0.3s"}})
            ),
            result.completude<50&&React.createElement("div",{style:{fontSize:9,color:C.accent,marginTop:3}},"⚠ Score normalisé sur données disponibles")
          ),
          // Prospect breakdown
          React.createElement("div",{style:{marginTop:12,fontSize:11,fontWeight:700,color:C.accent,marginBottom:4}},"📊 Score Prospect"),
          React.createElement(Bars,{sections:result.sections}),
          // Facilité breakdown
          React.createElement("div",{style:{marginTop:12,fontSize:11,fontWeight:700,color:"#22D3EE",marginBottom:4}},"🔧 Score Facilité"),
          React.createElement(Bars,{sections:result.facilite.sections}),
          // Action
          React.createElement("div",{style:{marginTop:12,padding:10,borderRadius:8,background:`${gInfo.color}11`,border:`1px solid ${gInfo.color}33`}},
            React.createElement("div",{style:{fontSize:10,fontWeight:700,color:gInfo.color,marginBottom:3,textTransform:"uppercase"}},"Action recommandée"),
            React.createElement("div",{style:{fontSize:11,color:C.muted,lineHeight:1.5}},gInfo.action),
            fScore>0&&fScore<50&&React.createElement("div",{style:{marginTop:6,fontSize:10,color:"#22D3EE",fontStyle:"italic"}},"⚠ Rénovation préalable probable — prévoir un parcours accompagné avant PV")
          ),
          React.createElement(ROICard,{roi:result.roi}),
          React.createElement(Details,{sections:result.sections}),
          React.createElement("div",{style:{marginTop:14,padding:12,background:C.bg,borderRadius:8}},
            React.createElement("div",{style:{fontFamily:"'JetBrains Mono', monospace",fontSize:11,color:C.accent,background:C.accentDim,padding:10,borderRadius:7,lineHeight:1.7}},"Global = Prospect × 0.6 + Facilité × 0.4"),
            React.createElement("p",{style:{fontSize:10,color:C.dim,marginTop:6,lineHeight:1.5}},"Chaque score est normalisé indépendamment sur 100. Le score global combine potentiel commercial et faisabilité technique.")
          )
        );
      }

      const tabContent=[
        // 0: DPE & Logement (tout ce qui vient du fichier DPE)
        ()=>React.createElement(React.Fragment,null,
          React.createElement("h3",{style:{margin:"0 0 14px",fontSize:14,fontWeight:700,color:C.accent}},"⚡ Données DPE"),
          React.createElement(Sel,{label:"Étiquette DPE",value:data.etiquetteDpe,onChange:s("etiquetteDpe"),options:["A","B","C","D","E","F","G"]}),
          React.createElement(Row,null,
            React.createElement(Sel,{label:"Énergie chauffage",value:data.energieChauffage,onChange:s("energieChauffage"),options:["Fioul domestique","GPL","Gaz naturel","Électricité","Bois","PAC"]}),
            React.createElement(Sel,{label:"Énergie ECS",value:data.energieECS,onChange:s("energieECS"),options:["Électricité (ballon)","Électricité (thermodynamique)","Fioul domestique","GPL","Gaz naturel","Solaire thermique","Bois","Réseau de chaleur"]})
          ),
          React.createElement(Row,null,
            React.createElement(Num,{label:"Coût chauffage",value:data.coutChauffage,onChange:s("coutChauffage"),unit:"€/an",placeholder:"2316"}),
            React.createElement(Num,{label:"Coût ECS",value:data.coutECS,onChange:s("coutECS"),unit:"€/an",placeholder:"432"})
          ),
          React.createElement(Row,null,
            React.createElement(Num,{label:"Conso électrique totale",value:data.consoElec,onChange:s("consoElec"),unit:"kWh",placeholder:"364"}),
            React.createElement(Num,{label:"Conso chauffage fossile",value:data.consoChauffFossile,onChange:s("consoChauffFossile"),unit:"kWh",placeholder:"15629"})
          ),
          React.createElement(Row,null,
            React.createElement(Sel,{label:"Zone climatique",value:data.zoneClimatique,onChange:s("zoneClimatique"),options:["H1a","H1b","H1c","H2a","H2b","H2c","H2d","H3"]}),
            React.createElement(Sel,{label:"Altitude",value:data.altitude,onChange:s("altitude"),options:["< 400m","400-800m","> 800m"]})
          ),
          React.createElement(Row,null,
            React.createElement(Num,{label:"Surface habitable",value:data.surface,onChange:s("surface"),unit:"m²",placeholder:"81"}),
            React.createElement(Sel,{label:"Niveaux",value:data.niveaux,onChange:s("niveaux"),options:["1","2","3+"]})
          ),
          React.createElement(Row,null,
            React.createElement(Sel,{label:"Période construction",value:data.periodeConstruction,onChange:s("periodeConstruction"),options:["Avant 1948","1948-1974","1975-1990","Après 1990"]}),
            React.createElement(Sel,{label:"PV existant ?",value:data.pvExistant,onChange:s("pvExistant"),options:["Non","Oui"]})
          ),
          React.createElement(Sel,{label:"Qualité isolation enveloppe",value:data.qualiteIsolation,onChange:s("qualiteIsolation"),options:["Bonne","Moyenne","Insuffisante","Très insuffisante"]}),
          React.createElement("div",{style:{marginTop:8,padding:9,background:C.accentDim,borderRadius:7,fontSize:10,color:C.accent,lineHeight:1.5}},"💡 Toutes ces données proviennent directement du fichier DPE ADEME. La qualité d'isolation alimente le score Facilité.")
        ),
        // 1: Toiture (données externes)
        ()=>React.createElement(React.Fragment,null,
          React.createElement("h3",{style:{margin:"0 0 14px",fontSize:14,fontWeight:700,color:C.cyan}},"🏗️ Toiture"),
          React.createElement("p",{style:{fontSize:11,color:C.dim,marginBottom:12,lineHeight:1.5}},"Données estimables via photo aérienne (Google Maps / IGN) ou visite terrain. Alimente aussi le ROI."),
          React.createElement(Row,null,
            React.createElement(Sel,{label:"Orientation principale",value:data.orientationToiture,onChange:s("orientationToiture"),options:["Sud","Sud-Est","Sud-Ouest","Est","Ouest","Nord-Est","Nord-Ouest","Nord"]}),
            React.createElement(Sel,{label:"Inclinaison",value:data.inclinaisonToiture,onChange:s("inclinaisonToiture"),options:["0-15° (plat)","15-35°","35-45°","> 45°"]})
          ),
          React.createElement(Num,{label:"Surface exploitable",value:data.surfaceToiture,onChange:s("surfaceToiture"),unit:"m²",placeholder:"55"})
        ),
      ];

      return React.createElement("div",{style:{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'Segoe UI', 'SF Pro Display', sans-serif"}},
        // Header
        React.createElement("div",{style:{background:`linear-gradient(135deg, ${C.card} 0%, ${C.bg} 100%)`,borderBottom:`1px solid ${C.border}`,padding:"16px 20px"}},
          React.createElement("div",{style:{maxWidth:960,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}},
            React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10}},
              React.createElement("div",{style:{width:34,height:34,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:C.accentDim,fontSize:18,border:`1px solid ${C.accent}33`}},"☀️"),
              React.createElement("div",null,
                React.createElement("h1",{style:{margin:0,fontSize:18,fontWeight:800,letterSpacing:"-0.02em"}},"Scoring Prospect ",React.createElement("span",{style:{color:C.accent}},"PV")," ",React.createElement("span",{style:{fontSize:11,color:C.dim,fontWeight:400}},"v3.0")),
                React.createElement("p",{style:{margin:0,fontSize:11,color:C.dim}},"Prospect · Facilité · Global · ROI")
              )
            ),
            React.createElement("div",{style:{display:"flex",gap:6}},
              React.createElement("button",{onClick:()=>setData({...EXAMPLE}),style:{padding:"5px 12px",borderRadius:6,border:`1px solid ${C.accent}44`,background:C.accentDim,color:C.accent,fontSize:11,fontWeight:600,cursor:"pointer"}},"Exemple DPE"),
              React.createElement("button",{onClick:()=>setData({...INIT}),style:{padding:"5px 12px",borderRadius:6,border:`1px solid ${C.border}`,background:"transparent",color:C.dim,fontSize:11,fontWeight:600,cursor:"pointer"}},"Reset")
            )
          )
        ),
        // Mobile toggle
        isMobile&&React.createElement("div",{style:{display:"flex",padding:"10px 20px",gap:8,background:C.card,borderBottom:`1px solid ${C.border}`}},
          React.createElement("button",{onClick:()=>setMobileView("form"),style:{flex:1,padding:"10px",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",border:`1px solid ${mobileView==="form"?C.accent+"66":C.border}`,background:mobileView==="form"?C.accentDim:"transparent",color:mobileView==="form"?C.accent:C.muted}},"📝 Données"),
          React.createElement("button",{onClick:()=>setMobileView("results"),style:{flex:1,padding:"10px",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",border:`1px solid ${mobileView==="results"?catInfo.color+"66":C.border}`,background:mobileView==="results"?`${catInfo.color}15`:"transparent",color:mobileView==="results"?catInfo.color:C.muted}},`${catInfo.icon} Global: ${result.global}/100`)
        ),
        // Body
        React.createElement("div",{style:{maxWidth:960,margin:"0 auto",padding:"16px 14px"}},
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:isMobile?"1fr":"minmax(0,1fr) 310px",gap:16,alignItems:"start"}},
            // Left form
            (!isMobile||mobileView==="form")&&React.createElement("div",null,
              React.createElement("div",{style:{display:"flex",gap:3,marginBottom:14,flexWrap:"wrap"}},
                tabs.map((t,i)=>React.createElement("button",{key:i,onClick:()=>setTab(i),style:{padding:"7px 13px",borderRadius:7,border:`1px solid ${tab===i?t.color+"55":C.border}`,background:tab===i?`${t.color}15`:"transparent",color:tab===i?t.color:C.muted,fontSize:12,fontWeight:600,cursor:"pointer",transition:"all 0.2s"}},`${t.icon} ${t.label}`))
              ),
              React.createElement("div",{style:{background:C.card,borderRadius:11,border:`1px solid ${C.border}`,padding:18,minHeight:320}},tabContent[tab]())
            ),
            // Right results (desktop)
            !isMobile&&React.createElement("div",{style:{position:"sticky",top:14}},React.createElement(ResultsPanel)),
            // Mobile results
            isMobile&&mobileView==="results"&&React.createElement(ResultsPanel)
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
