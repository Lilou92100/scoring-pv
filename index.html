<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoring Prospect PV v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B0F1A; color: #F1F5F9; font-family: 'Segoe UI', 'SF Pro Display', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    select, input, button { font-family: inherit; }
    select option { background: #111827; color: #F1F5F9; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { opacity: 1; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F1A; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    const C = {
      bg:"#0B0F1A",card:"#111827",border:"#1E293B",
      accent:"#F59E0B",accentDim:"rgba(245,158,11,0.12)",
      green:"#10B981",red:"#EF4444",blue:"#3B82F6",
      purple:"#8B5CF6",cyan:"#06B6D4",
      orange:"#F97316",orangeDim:"rgba(249,115,22,0.12)",
      text:"#F1F5F9",muted:"#94A3B8",dim:"#64748B",
    };

    const CATS = {
      A:{label:"Prospect Chaud",color:C.green,icon:"🔥",action:"Contact prioritaire · Offre personnalisée · Visite terrain sous 48h"},
      B:{label:"Prospect Tiède",color:C.accent,icon:"☀️",action:"Campagne ciblée · Simulation gratuite · Nurturing email/SMS"},
      C:{label:"Prospect Froid",color:C.blue,icon:"❄️",action:"Sensibilisation · Contenu éducatif · Veille opportunité"},
      D:{label:"Hors Cible",color:C.red,icon:"⛔",action:"Pas d'action commerciale directe"},
    };
    const getCat=s=>s>=75?"A":s>=55?"B":s>=35?"C":"D";

    // ═══════════ SCORING ═══════════

    function scoreDPE(d){
      let pts=0,max=0,details=[];
      const dpeMap={D:10,E:9,C:8,F:7,B:5,G:4,A:2};
      if(d.etiquetteDpe){const v=dpeMap[d.etiquetteDpe]||0;pts+=v;max+=10;details.push({l:`Étiquette ${d.etiquetteDpe}`,p:v,m:10});}
      const eMap={"Fioul domestique":8,GPL:7,"Électricité":6,"Gaz naturel":5,Bois:2,PAC:2};
      if(d.energieChauffage){const v=eMap[d.energieChauffage]||0;pts+=v;max+=8;details.push({l:`Énergie: ${d.energieChauffage}`,p:v,m:8});}
      if(d.coutAnnuel!==""){const c=+d.coutAnnuel;const v=c>3000?7:c>2000?5:c>1000?3:1;pts+=v;max+=7;details.push({l:`Coût ${c.toLocaleString("fr-FR")} €/an`,p:v,m:7});}
      if(d.consoEF!==""){const c=+d.consoEF;const v=c>20000?5:c>10000?4:c>5000?2:1;pts+=v;max+=5;details.push({l:`Conso ${(c/1000).toFixed(1)}k kWh`,p:v,m:5});}
      return{pts,max:max||30,details,section:"DPE Enrichi",color:C.accent};
    }

    function scoreGeo(d){
      let pts=0,max=0,details=[];
      const zMap={H3:14,H2d:14,H2c:14,H2b:12,H2a:10,H1c:6,H1b:6,H1a:6};
      if(d.zoneClimatique){const v=zMap[d.zoneClimatique]||6;pts+=v;max+=14;details.push({l:`Zone ${d.zoneClimatique}`,p:v,m:14});}
      const aMap={"< 400m":3,"400-800m":2,"> 800m":1};
      if(d.altitude){const v=aMap[d.altitude]||2;pts+=v;max+=3;details.push({l:`Altitude ${d.altitude}`,p:v,m:3});}
      const tMap={Périurbain:3,Rural:2,"Urbain dense":1};
      if(d.typeZone){const v=tMap[d.typeZone]||2;pts+=v;max+=3;details.push({l:`Zone ${d.typeZone}`,p:v,m:3});}
      return{pts,max:max||20,details,section:"Géographique",color:C.blue};
    }

    function scoreToiture(d){
      let pts=0,max=0,details=[];
      const oMap={Sud:8,"Sud-Est":7,"Sud-Ouest":7,Est:4,Ouest:4,"Nord-Est":1,"Nord-Ouest":1,Nord:0};
      if(d.orientationToiture){const v=oMap[d.orientationToiture]??4;pts+=v;max+=8;details.push({l:`Orientation ${d.orientationToiture}`,p:v,m:8});}
      const iMap={"15-35°":5,"0-15° (plat)":3,"35-45°":3,"> 45°":1};
      if(d.inclinaisonToiture){const v=iMap[d.inclinaisonToiture]||3;pts+=v;max+=5;details.push({l:`Inclinaison ${d.inclinaisonToiture}`,p:v,m:5});}
      if(d.surfaceToiture!==""){const s=+d.surfaceToiture;const v=s>60?4:s>40?3:s>20?2:1;pts+=v;max+=4;details.push({l:`Surface toiture ${s} m²`,p:v,m:4});}
      const omMap={Aucun:3,"Partiel (arbre, bâtiment)":1,Important:0};
      if(d.ombrage){const v=omMap[d.ombrage]??1;pts+=v;max+=3;details.push({l:`Ombrage: ${d.ombrage}`,p:v,m:3});}
      if(d.etatToiture){const v=d.etatToiture==="Bon état"?3:d.etatToiture==="Correct"?2:0;pts+=v;max+=3;details.push({l:`État: ${d.etatToiture}`,p:v,m:3});}
      return{pts,max:max||23,details,section:"Faisabilité Toiture",color:C.cyan};
    }

    function scoreBatiment(d){
      let pts=0,max=0,details=[];
      if(d.typeBatiment){const v=d.typeBatiment==="Maison"?5:0;pts+=v;max+=5;details.push({l:d.typeBatiment,p:v,m:5});}
      if(d.surface!==""){const s=+d.surface;const v=s>120?5:s>80?4:s>50?3:1;pts+=v;max+=5;details.push({l:`${s} m²`,p:v,m:5});}
      const nMap={"1":4,"2":3,"3+":2};
      if(d.niveaux){const v=nMap[d.niveaux]||2;pts+=v;max+=4;details.push({l:`${d.niveaux} niveau(x)`,p:v,m:4});}
      const pMap={"Après 1990":4,"1975-1990":3,"1948-1974":2,"Avant 1948":1};
      if(d.periodeConstruction){const v=pMap[d.periodeConstruction]||2;pts+=v;max+=4;details.push({l:d.periodeConstruction,p:v,m:4});}
      if(d.pvExistant!==""){const v=d.pvExistant==="Non"?2:-20;pts+=v;max+=2;details.push({l:`PV existant: ${d.pvExistant}`,p:v,m:2});}
      return{pts,max:max||20,details,section:"Bâtiment",color:C.purple};
    }

    function scoreSocio(d){
      let pts=0,max=0,details=[];
      if(d.proprietaire){const v=d.proprietaire==="Propriétaire occupant"?6:d.proprietaire==="Propriétaire bailleur"?3:0;pts+=v;max+=6;details.push({l:d.proprietaire,p:v,m:6});}
      const rMap={"Déciles 6-8":5,"Déciles 9-10":4,"Déciles 4-5":3,"Déciles 1-3":1};
      if(d.revenus){const v=rMap[d.revenus]||0;pts+=v;max+=5;details.push({l:`Revenus ${d.revenus}`,p:v,m:5});}
      if(d.revenuMedianIRIS!==""){const r=+d.revenuMedianIRIS;const v=r>28000?4:r>22000?3:r>16000?2:1;pts+=v;max+=4;details.push({l:`Revenu médian IRIS ${(r/1000).toFixed(0)}k€`,p:v,m:4});}
      if(d.tauxProprioIRIS!==""){const t=+d.tauxProprioIRIS;const v=t>70?3:t>50?2:1;pts+=v;max+=3;details.push({l:`Taux proprio IRIS ${t}%`,p:v,m:3});}
      if(d.partMaisonsIRIS!==""){const m=+d.partMaisonsIRIS;const v=m>70?2:m>40?1:0;pts+=v;max+=2;details.push({l:`Part maisons IRIS ${m}%`,p:v,m:2});}
      if(d.piscine){pts+=3;max+=3;details.push({l:"Piscine",p:3,m:3});}
      if(d.vehiculeElec){pts+=3;max+=3;details.push({l:"Véhicule électrique",p:3,m:3});}
      if(d.climatisation){pts+=2;max+=2;details.push({l:"Climatisation",p:2,m:2});}
      return{pts,max:max||20,details,section:"Socio & Équipements",color:C.green};
    }

    function scoreBonus(d){
      let pts=0,details=[];
      if(d.voisinagePV){pts+=4;details.push({l:"Voisinage PV",p:4,m:4});}
      if(d.traversant){pts+=2;details.push({l:"Logement traversant",p:2,m:2});}
      if(d.isolationInsuffisante){pts+=2;details.push({l:"Isolation insuffisante (opportunité)",p:2,m:2});}
      if(d.zoneABF){pts-=8;details.push({l:"Zone ABF / classée",p:-8,m:0});}
      if(d.toitureNord){pts-=10;details.push({l:"Toiture Nord exclusive",p:-10,m:0});}
      if(d.aidesLocales){pts+=3;details.push({l:"Aides locales disponibles",p:3,m:3});}
      return{pts,max:10,details,section:"Bonus / Malus",color:C.dim};
    }

    function computeROI(d){
      if(!d.zoneClimatique||d.surfaceToiture===""||d.coutAnnuel==="") return null;
      const prodMap={H3:1350,H2d:1250,H2c:1200,H2b:1100,H2a:1050,H1c:1000,H1b:950,H1a:900};
      const kWhParKwc=prodMap[d.zoneClimatique]||1050;
      const surfUtil=+d.surfaceToiture*(d.ombrage==="Important"?0.5:d.ombrage==="Partiel (arbre, bâtiment)"?0.75:1);
      const oCoeff={Sud:1,"Sud-Est":0.94,"Sud-Ouest":0.94,Est:0.82,Ouest:0.82,"Nord-Est":0.6,"Nord-Ouest":0.6,Nord:0.45}[d.orientationToiture]||0.9;
      const iCoeff={"15-35°":1,"0-15° (plat)":0.9,"35-45°":0.92,"> 45°":0.78}[d.inclinaisonToiture]||0.92;
      const kwcMax=Math.min(9,Math.floor(surfUtil/6));
      if(kwcMax<1) return null;
      const prodAnnuelle=kwcMax*kWhParKwc*oCoeff*iCoeff;
      const tauxAutoconso=d.consoEF!==""?Math.min(0.7,(+d.consoEF*0.7)/prodAnnuelle):0.45;
      const prixKwh=0.2516,prixRevente=0.1269;
      const econAutoconso=prodAnnuelle*tauxAutoconso*prixKwh;
      const reventeExcedent=prodAnnuelle*(1-tauxAutoconso)*prixRevente;
      const gainAnnuel=econAutoconso+reventeExcedent;
      const coutInstall=kwcMax*2400;
      const primeAutoconso=kwcMax<=3?kwcMax*370:kwcMax<=9?kwcMax*280:kwcMax*200;
      const investNet=coutInstall-primeAutoconso;
      const retour=gainAnnuel>0?investNet/gainAnnuel:99;
      return{kwc:kwcMax,prodAnnuelle:Math.round(prodAnnuelle),gainAnnuel:Math.round(gainAnnuel),investNet:Math.round(investNet),retour:Math.round(retour*10)/10,tauxAutoconso:Math.round(tauxAutoconso*100),econAutoconso:Math.round(econAutoconso),reventeExcedent:Math.round(reventeExcedent),primeAutoconso:Math.round(primeAutoconso)};
    }

    function computeTotal(d){
      const sections=[scoreDPE(d),scoreGeo(d),scoreToiture(d),scoreBatiment(d),scoreSocio(d),scoreBonus(d)];
      const rawPts=sections.reduce((s,sec)=>s+sec.pts,0);
      const maxR=sections.reduce((s,sec)=>s+sec.max,0);
      const norm=maxR>0?Math.round((rawPts/maxR)*100):0;
      const score=Math.max(0,Math.min(100,norm));
      const allFields=[d.etiquetteDpe,d.energieChauffage,d.coutAnnuel,d.consoEF,d.zoneClimatique,d.altitude,d.typeZone,d.orientationToiture,d.inclinaisonToiture,d.surfaceToiture,d.ombrage,d.etatToiture,d.typeBatiment,d.surface,d.niveaux,d.periodeConstruction,d.pvExistant,d.proprietaire,d.revenus,d.revenuMedianIRIS,d.tauxProprioIRIS,d.partMaisonsIRIS];
      const filled=allFields.filter(v=>v!==""&&v!==null&&v!==undefined).length;
      const boolFields=[d.piscine,d.vehiculeElec,d.climatisation,d.voisinagePV,d.traversant,d.isolationInsuffisante,d.zoneABF,d.toitureNord,d.aidesLocales];
      const boolFilled=boolFields.some(b=>b)?1:0;
      const completude=Math.round(((filled+boolFilled)/(allFields.length+1))*100);
      return{score,sections,completude,roi:computeROI(d)};
    }

    // ═══════════ UI ═══════════

    const labelSt={display:"block",fontSize:11,fontWeight:700,color:C.muted,marginBottom:3,letterSpacing:"0.04em",textTransform:"uppercase"};
    const inputSt={width:"100%",padding:"9px 11px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:7,color:C.text,fontSize:13,outline:"none",boxSizing:"border-box"};

    function Sel({label,value,onChange,options,hint}){
      return React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:labelSt},label),
        React.createElement("select",{value,onChange:e=>onChange(e.target.value),style:{...inputSt,color:value?C.text:C.dim,cursor:"pointer"}},
          React.createElement("option",{value:""},hint||"— Sélectionner —"),
          options.map(o=>React.createElement("option",{key:o,value:o},o))
        )
      );
    }

    function Num({label,value,onChange,unit,placeholder}){
      return React.createElement("div",{style:{marginBottom:12}},
        React.createElement("label",{style:labelSt},label),
        React.createElement("div",{style:{position:"relative"}},
          React.createElement("input",{type:"number",value,onChange:e=>onChange(e.target.value),placeholder:placeholder||"—",style:{...inputSt,paddingRight:unit?48:11}}),
          unit&&React.createElement("span",{style:{position:"absolute",right:11,top:"50%",transform:"translateY(-50%)",color:C.dim,fontSize:12}},unit)
        )
      );
    }

    function Tog({label,checked,onChange}){
      return React.createElement("div",{onClick:()=>onChange(!checked),style:{display:"flex",alignItems:"center",gap:9,cursor:"pointer",padding:"6px 0",fontSize:13,color:checked?C.text:C.muted,userSelect:"none"}},
        React.createElement("div",{style:{width:36,height:20,borderRadius:10,position:"relative",background:checked?C.accent:C.border,transition:"background 0.2s",flexShrink:0}},
          React.createElement("div",{style:{width:16,height:16,borderRadius:"50%",background:"#fff",position:"absolute",top:2,left:checked?18:2,transition:"left 0.2s",boxShadow:"0 1px 2px rgba(0,0,0,0.3)"}})
        ),
        React.createElement("span",null,label)
      );
    }

    function Row({children}){return React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},children);}

    function ScoreGauge({score}){
      const cat=getCat(score),info=CATS[cat],sz=190,circ=Math.PI*(sz-20),off=circ-(score/100)*circ;
      return React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center"}},
        React.createElement("svg",{width:sz,height:sz/2+30,viewBox:`0 0 ${sz} ${sz/2+30}`},
          React.createElement("path",{d:`M 10 ${sz/2+10} A ${sz/2-10} ${sz/2-10} 0 0 1 ${sz-10} ${sz/2+10}`,fill:"none",stroke:C.border,strokeWidth:10,strokeLinecap:"round"}),
          React.createElement("path",{d:`M 10 ${sz/2+10} A ${sz/2-10} ${sz/2-10} 0 0 1 ${sz-10} ${sz/2+10}`,fill:"none",stroke:info.color,strokeWidth:10,strokeLinecap:"round",strokeDasharray:circ,strokeDashoffset:off,style:{transition:"stroke-dashoffset 0.7s ease-out, stroke 0.3s"}}),
          React.createElement("text",{x:sz/2,y:sz/2-5,textAnchor:"middle",fill:info.color,style:{fontSize:44,fontWeight:800,fontFamily:"'JetBrains Mono', monospace"}},score),
          React.createElement("text",{x:sz/2,y:sz/2+18,textAnchor:"middle",fill:C.dim,style:{fontSize:13}},"/ 100")
        ),
        React.createElement("div",{style:{marginTop:4,padding:"5px 18px",borderRadius:20,background:`${info.color}18`,border:`1px solid ${info.color}44`,color:info.color,fontWeight:700,fontSize:14}},`${info.icon} ${cat} — ${info.label}`)
      );
    }

    function Bars({sections}){
      return React.createElement("div",{style:{marginTop:14}},
        sections.map(sec=>{
          const pct=sec.max>0?Math.max(0,(sec.pts/sec.max)*100):0;
          return React.createElement("div",{key:sec.section,style:{marginBottom:10}},
            React.createElement("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3,color:C.muted}},
              React.createElement("span",{style:{fontWeight:600}},sec.section),
              React.createElement("span",{style:{fontFamily:"'JetBrains Mono', monospace",color:sec.color}},`${sec.pts}/${sec.max}`)
            ),
            React.createElement("div",{style:{height:5,background:C.border,borderRadius:3,overflow:"hidden"}},
              React.createElement("div",{style:{height:"100%",width:`${pct}%`,background:sec.color,borderRadius:3,transition:"width 0.5s ease-out"}})
            )
          );
        })
      );
    }

    function Details({sections}){
      const[open,setOpen]=useState(null);
      return React.createElement("div",{style:{marginTop:10}},
        React.createElement("div",{style:{fontSize:11,fontWeight:700,color:C.dim,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Détail scoring"),
        sections.map((sec,i)=>React.createElement("div",{key:sec.section,style:{marginBottom:3}},
          React.createElement("div",{onClick:()=>setOpen(open===i?null:i),style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:open===i?`${sec.color}11`:"transparent",border:`1px solid ${open===i?sec.color+"44":C.border}`,borderRadius:7,cursor:"pointer",transition:"all 0.2s"}},
            React.createElement("span",{style:{fontSize:12,fontWeight:600,color:C.text}},sec.section),
            React.createElement("span",{style:{fontSize:11,color:sec.color,fontFamily:"'JetBrains Mono', monospace"}},`${sec.pts} pts ${open===i?"▴":"▾"}`)
          ),
          open===i&&React.createElement("div",{style:{padding:"6px 10px 4px 22px"}},
            sec.details.length===0
              ?React.createElement("div",{style:{fontSize:11,color:C.dim,fontStyle:"italic"}},"Aucune donnée renseignée")
              :sec.details.map((dd,j)=>React.createElement("div",{key:j,style:{display:"flex",justifyContent:"space-between",fontSize:11,padding:"2px 0",color:C.muted}},
                React.createElement("span",null,dd.l),
                React.createElement("span",{style:{fontFamily:"'JetBrains Mono', monospace",fontWeight:600,color:dd.p>0?sec.color:dd.p<0?C.red:C.dim}},`${dd.p>0?"+":""}${dd.p}`)
              ))
          )
        ))
      );
    }

    function ROICard({roi}){
      if(!roi) return React.createElement("div",{style:{marginTop:14,padding:14,background:C.orangeDim,border:`1px solid ${C.orange}33`,borderRadius:10}},
        React.createElement("div",{style:{fontSize:12,fontWeight:700,color:C.orange,marginBottom:4}},"📊 Estimateur ROI"),
        React.createElement("div",{style:{fontSize:11,color:C.muted,lineHeight:1.5}},"Renseignez la zone climatique, la surface toiture et le coût énergie annuel pour activer l'estimation.")
      );
      const retourColor=roi.retour<=8?C.green:roi.retour<=12?C.accent:C.red;
      const roiLines=[["Puissance installable",`${roi.kwc} kWc`],["Production annuelle",`${roi.prodAnnuelle.toLocaleString("fr-FR")} kWh`],["Taux d'autoconsommation",`${roi.tauxAutoconso}%`],["Économie autoconso.",`${roi.econAutoconso.toLocaleString("fr-FR")} €/an`],["Revente excédent (OA)",`${roi.reventeExcedent.toLocaleString("fr-FR")} €/an`],["Prime autoconsommation",`${roi.primeAutoconso.toLocaleString("fr-FR")} €`],["Investissement net",`${roi.investNet.toLocaleString("fr-FR")} €`]];
      return React.createElement("div",{style:{marginTop:14,padding:14,background:`${C.green}08`,border:`1px solid ${C.green}33`,borderRadius:10}},
        React.createElement("div",{style:{fontSize:12,fontWeight:700,color:C.green,marginBottom:10}},"📊 Estimation ROI Photovoltaïque"),
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}},
          React.createElement("div",{style:{background:C.bg,borderRadius:8,padding:10,textAlign:"center"}},
            React.createElement("div",{style:{fontSize:22,fontWeight:800,color:retourColor,fontFamily:"'JetBrains Mono', monospace"}},roi.retour,React.createElement("span",{style:{fontSize:12}}," ans")),
            React.createElement("div",{style:{fontSize:10,color:C.dim,marginTop:2}},"Temps de retour")
          ),
          React.createElement("div",{style:{background:C.bg,borderRadius:8,padding:10,textAlign:"center"}},
            React.createElement("div",{style:{fontSize:22,fontWeight:800,color:C.accent,fontFamily:"'JetBrains Mono', monospace"}},roi.gainAnnuel,React.createElement("span",{style:{fontSize:12}}," €")),
            React.createElement("div",{style:{fontSize:10,color:C.dim,marginTop:2}},"Gain annuel")
          )
        ),
        React.createElement("div",{style:{fontSize:11,color:C.muted,lineHeight:1.9}},
          roiLines.map(([k,v])=>React.createElement("div",{key:k,style:{display:"flex",justifyContent:"space-between"}},
            React.createElement("span",null,k),
            React.createElement("span",{style:{fontFamily:"'JetBrains Mono', monospace",fontWeight:600,color:C.text}},v)
          ))
        ),
        React.createElement("div",{style:{marginTop:8,fontSize:10,color:C.dim,lineHeight:1.4,fontStyle:"italic"}},"* Estimation indicative · Tarif réglementé 2025 (0,2516 €/kWh) · OA S1 2025")
      );
    }

    // ═══════════ MAIN ═══════════
